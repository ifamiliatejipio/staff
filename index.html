<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Relatório Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F0E8;
    --paper:#FBF9F4;
    --panel:#1C2430;
    --panel-2:#232D3B;
    --gold:#C9A24A;
    --gold-dim:#9c7f38;
    --green:#2F7D5C;
    --green-bg:#E4F0EA;
    --red:#B23A32;
    --red-bg:#F6E7E5;
    --ink:#1C2430;
    --muted:#767467;
    --line:#DFDACD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(28,36,48,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
    padding:18px 14px 60px;
  }
  .wrap{max-width:460px;margin:0 auto;}

  /* Header - painel de console */
  .console{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-radius:16px;
    padding:20px 20px 18px;
    box-shadow:0 10px 30px -12px rgba(28,36,48,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
    overflow:hidden;
  }
  .console::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
    pointer-events:none;
  }
  .plate{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .plate .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 1px rgba(201,162,74,0.7);
  }
  .plate span{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.22em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .title-row{
    display:flex; align-items:center; gap:14px; margin-bottom:4px;
  }
  .logo-mark{
    width:46px; height:46px; flex-shrink:0;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(201,162,74,0.35);
    display:flex; align-items:center; justify-content:center;
    padding:8px;
  }
  .logo-mark img{
    width:100%; height:100%; object-fit:contain;
  }
  .console h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    color:#F6F3EA;
    margin:0;
    letter-spacing:-0.01em;
    line-height:1.15;
  }
  .console .sub{
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:#9AA3B0;
    margin-bottom:18px;
  }

  .meter{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(0,0,0,0.22);
    border-radius:10px;
    padding:10px 12px;
    font-family:'JetBrains Mono',monospace;
  }
  .meter-label{font-size:11px;color:#9AA3B0;letter-spacing:0.08em;}
  .meter-count{font-size:14px;color:var(--gold);font-weight:700;}
  .meter-bar{
    height:5px; border-radius:3px; background:rgba(255,255,255,0.08);
    margin-top:8px; overflow:hidden;
  }
  .meter-bar-fill{
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold));
    transition:width .25s ease;
  }

  /* Ficha de data/hora */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-top:14px;
  }
  .card-title{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .card-title-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; gap:8px;
  }
  .btn-now{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold-dim);
    border-radius:20px;
    padding:6px 12px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-now:active{
    background:var(--gold);
    color:#20180a;
  }
  .row-inline{display:flex; flex-direction:row; flex-wrap:wrap; gap:14px; justify-content:center;}
  .field{width:auto; flex:0 1 150px; max-width:150px; text-align:center;}
  .field label{
    display:block; font-size:11px; color:var(--muted); margin-bottom:5px;
    font-weight:600; text-align:center;
  }
  .field input{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    padding:9px 4px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    text-align:center;
  }
  .field input::-webkit-datetime-edit{
    padding:0;
  }
  .field input::-webkit-calendar-picker-indicator{
    margin-left:4px;
    padding:0;
  }
  .field input:focus{outline:2px solid var(--gold-dim); outline-offset:1px;}

  /* Seletor de culto */
  .seg{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .seg-btn{
    flex:1; min-width:120px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    padding:11px 10px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .seg-btn.active{
    background:var(--panel);
    border-color:var(--panel);
    color:#F6F3EA;
  }
  .sub-seg{
    margin-top:10px;
  }
  .sub-seg .seg-btn{
    min-width:70px;
    background:var(--paper);
  }
  .sub-seg .seg-btn.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#20180a;
  }

  /* Subopções dentro dos itens (instrumentos, quantidade) */
  .item-sub{
    display:none;
    flex-wrap:wrap;
    gap:6px;
    padding-top:2px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }
  .item-sub.show{display:flex;}

  .item-name-panel{
    display:none;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .item-name-panel.show{display:block;}
  .name-label{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:600;
    margin-bottom:6px;
  }
  .name-input{
    width:100%;
    box-sizing:border-box;
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    padding:9px 10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .name-input:focus{outline:2px solid var(--gold-dim); outline-offset:1px;}
  .chip{
    border:1px solid var(--line);
    background:#fff;
    border-radius:20px;
    padding:7px 13px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .chip.active{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }
  .chip.num{
    padding:7px 15px;
  }

  /* Lista de áreas */
  .list{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .item{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 12px 12px 14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .item-main-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .item.pending{border-left:3px solid #D8D2BE;}
  .item.ok{border-left:3px solid var(--green); background:linear-gradient(90deg, var(--green-bg), var(--paper) 55%);}
  .item.bad{border-left:3px solid var(--red); background:linear-gradient(90deg, var(--red-bg), var(--paper) 55%);}

  .item-name{font-size:15.5px; font-weight:600; color:var(--ink);}
  .led{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#D8D2BE; margin-right:9px; vertical-align:middle;
    position:relative; top:-1px;
  }
  .item.ok .led{background:var(--green); box-shadow:0 0 6px rgba(47,125,92,0.6);}
  .item.bad .led{background:var(--red); box-shadow:0 0 6px rgba(178,58,50,0.6);}

  .toggle{display:flex; gap:6px;}
  .btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    width:40px; height:36px;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:#B7B2A0;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.92);}
  .btn.check.active{background:var(--green); border-color:var(--green); color:#fff;}
  .btn.x.active{background:var(--red); border-color:var(--red); color:#fff;}
  .btn.none{
    width:auto; padding:0 10px; font-size:11px; font-weight:700;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.03em;
  }
  .btn.none.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  /* Botão gerar */
  .generate{
    width:100%; margin-top:18px;
    background:var(--panel);
    color:#F6F3EA;
    border:none; border-radius:14px;
    padding:16px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 10px 24px -12px rgba(28,36,48,0.5);
  }
  .generate:active{transform:translateY(1px);}
  .generate:disabled{opacity:0.45; cursor:not-allowed;}

  .hint{
    text-align:center; font-size:12px; color:var(--muted); margin-top:8px;
  }

  /* Resultado */
  .result{
    margin-top:16px; display:none;
  }
  .result.show{display:block;}
  .result-box{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .result-title{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px;
  }
  #reportText{
    width:100%; min-height:260px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
    background:#fff;
    resize:vertical;
  }
  .actions{display:flex; gap:8px; margin-top:12px;}
  .actions button{
    flex:1;
    border:none;
    border-radius:10px;
    padding:13px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .btn-copy{background:var(--gold); color:#20180a;}
  .btn-share{background:var(--green); color:#fff;}
  .copied-msg{
    text-align:center; font-size:12.5px; color:var(--green); font-weight:600;
    margin-top:8px; height:16px; opacity:0; transition:opacity .2s ease;
  }
  .copied-msg.show{opacity:1;}
</style>
</head>

      </div>
      <div class="meter-count" id="meterCount">0/11</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Culto</div>
    <div class="seg" id="cultoTipoSeg">
      <button type="button" class="seg-btn" data-tipo="domingo">Domingo</button>
      <button type="button" class="seg-btn" data-tipo="uncao">Noite da Unção</button>
    </div>
    <div class="seg sub-seg" id="cultoOpcaoSeg" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="card-title-row">
      <div class="card-title" style="margin:0;">Data e horário</div>
      <button type="button" class="btn-now" id="nowBtn">↻ Atualizar para agora</button>
    </div>
    <div class="row-inline">
      <div class="field">
        <label for="dataInput">Data</label>
        <input type="date" id="dataInput">
      </div>
      <div class="field">
        <label for="horaInput">Horário</label>
        <input type="time" id="horaInput">
      </div>
    </div>
  </div>

  <div class="list" id="itemList"></div>

  <button class="generate" id="generateBtn" disabled>Gerar relatório</button>
  <div class="hint" id="hintText">Preencha todas as áreas para gerar</div>

  <div class="result" id="resultBlock">
    <div class="result-box">
      <div class="result-title">Texto para enviar</div>
      <textarea id="reportText" readonly></textarea>
      <div class="actions">
        <button class="btn-copy" id="copyBtn">Copiar texto</button>
        <button class="btn-share" id="shareBtn">Enviar</button>
      </div>
      <div class="copied-msg" id="copiedMsg">Copiado!</div>
    </div>
  </div>

</div>

<script>
  const areas = [
    { key: "seguranca",     label: "Segurança", sub: { type: "single", options: [1,2,3,4], displayFn: n => n + (n === 1 ? ' presente' : ' presentes') }, supPrefix: true },
    { key: "consolidacao",  label: "Consolidação", supPrefix: true },
    { key: "recepcao",      label: "Recepção", supPrefix: true },
    { key: "projecao",      label: "Projeção", noName: true },
    { key: "som",           label: "Som", noName: true },
    { key: "iluminacao",    label: "Iluminação", noName: true },
    { key: "louvor",        label: "Louvor", sub: { type: "multi", options: ["Vocal","Teclado","Guitarra","Baixo","Bateria","Violão"] }, noName: true },
    { key: "foto",          label: "Foto", noName: true },
    { key: "stories",       label: "Stories", noName: true },
    { key: "saude",         label: "Saúde", noName: true },
    { key: "base",          label: "Base Kids", special: true, noName: true }
  ];

  const state = {};
  const extra = {};
  const responsavel = {};
  const culto = { tipo: null, opcao: null };

  const opcoesPorTipo = {
    domingo: ['10h', '15h', '17h', '19h'],
    uncao: ['Terça', 'Quarta', 'Quinta']
  };
  const nomeTipo = {
    domingo: 'Domingo',
    uncao: 'Noite da Unção'
  };

  const cultoTipoSeg = document.getElementById('cultoTipoSeg');
  const cultoOpcaoSeg = document.getElementById('cultoOpcaoSeg');

  cultoTipoSeg.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tipo = btn.dataset.tipo;
      culto.tipo = tipo;
      culto.opcao = null;

      cultoTipoSeg.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      cultoOpcaoSeg.innerHTML = '';
      opcoesPorTipo[tipo].forEach(op => {
        const opBtn = document.createElement('button');
        opBtn.type = 'button';
        opBtn.className = 'seg-btn';
        opBtn.textContent = op;
        opBtn.addEventListener('click', () => {
          culto.opcao = op;
          cultoOpcaoSeg.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
          opBtn.classList.add('active');
          updateProgress();
        });
        cultoOpcaoSeg.appendChild(opBtn);
      });
      cultoOpcaoSeg.style.display = 'flex';
      updateProgress();
    });
  });

  const listEl = document.getElementById('itemList');
  const generateBtn = document.getElementById('generateBtn');
  const hintText = document.getElementById('hintText');
  const meterFill = document.getElementById('meterFill');
  const meterCount = document.getElementById('meterCount');

  function buildRow(area){
    const item = document.createElement('div');
    item.className = 'item pending';
    item.id = 'item-' + area.key;

    const mainRow = document.createElement('div');
    mainRow.className = 'item-main-row';

    const nameWrap = document.createElement('div');
    nameWrap.innerHTML = '<span class="led"></span><span class="item-name">' + area.label + '</span>';

    const toggle = document.createElement('div');
    toggle.className = 'toggle';

    const btnCheck = document.createElement('button');
    btnCheck.className = 'btn check';
    btnCheck.type = 'button';
    btnCheck.textContent = '✓';
    btnCheck.addEventListener('click', () => setState(area, 'ok'));

    const btnX = document.createElement('button');
    btnX.className = 'btn x';
    btnX.type = 'button';
    btnX.textContent = '✗';
    btnX.addEventListener('click', () => setState(area, 'bad'));

    toggle.appendChild(btnCheck);
    toggle.appendChild(btnX);

    if (area.special) {
      const btnNone = document.createElement('button');
      btnNone.className = 'btn none';
      btnNone.type = 'button';
      btnNone.textContent = 'SEM BASE';
      btnNone.addEventListener('click', () => setState(area, 'none'));
      toggle.appendChild(btnNone);
    }

    mainRow.appendChild(nameWrap);
    mainRow.appendChild(toggle);
    item.appendChild(mainRow);

    if (area.sub) {
      const subPanel = document.createElement('div');
      subPanel.className = 'item-sub';
      subPanel.id = 'sub-' + area.key;

      area.sub.options.forEach(opt => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (area.sub.type === 'single' ? ' num' : '');
        chip.textContent = area.sub.displayFn ? area.sub.displayFn(opt) : opt;
        chip.addEventListener('click', () => {
          if (area.sub.type === 'single') {
            extra[area.key] = opt;
            subPanel.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
          } else {
            const list = extra[area.key] || [];
            const idx = list.indexOf(opt);
            if (idx === -1) { list.push(opt); chip.classList.add('active'); }
            else { list.splice(idx,1); chip.classList.remove('active'); }
            extra[area.key] = list;
          }
          updateProgress();
        });
        subPanel.appendChild(chip);
      });

      item.appendChild(subPanel);
    }

    if (!area.noName) {
      const namePanel = document.createElement('div');
      namePanel.className = 'item-name-panel';
      namePanel.id = 'namepanel-' + area.key;

      const nameLabel = document.createElement('label');
      nameLabel.className = 'name-label';
      nameLabel.textContent = area.supPrefix ? 'Nome do supervisor (opcional)' : 'Nome do responsável (opcional)';
      nameLabel.setAttribute('for', 'nameinput-' + area.key);

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.id = 'nameinput-' + area.key;
      nameInput.className = 'name-input';
      nameInput.placeholder = 'Digite o nome...';
      nameInput.addEventListener('input', () => {
        const val = nameInput.value.trim();
        if (val) responsavel[area.key] = val;
        else delete responsavel[area.key];
      });

      namePanel.appendChild(nameLabel);
      namePanel.appendChild(nameInput);
      item.appendChild(namePanel);
    }

    listEl.appendChild(item);
  }

  function setState(area, value){
    state[area.key] = value;
    const item = document.getElementById('item-' + area.key);
    item.classList.remove('pending','ok','bad');
    item.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));

    if (value === 'ok') {
      item.classList.add('ok');
      item.querySelector('.btn.check').classList.add('active');
    } else if (value === 'bad') {
      item.classList.add('bad');
      item.querySelector('.btn.x').classList.add('active');
    } else if (value === 'none') {
      item.classList.add('pending');
      item.querySelector('.btn.none').classList.add('active');
    }

    if (area.sub) {
      const subPanel = document.getElementById('sub-' + area.key);
      if (value === 'ok') {
        subPanel.classList.add('show');
      } else {
        subPanel.classList.remove('show');
        subPanel.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        delete extra[area.key];
      }
    }

    const namePanel = document.getElementById('namepanel-' + area.key);
    if (namePanel) {
      const nameInput = document.getElementById('nameinput-' + area.key);
      if (value === 'ok') {
        namePanel.classList.add('show');
      } else {
        namePanel.classList.remove('show');
        nameInput.value = '';
        delete responsavel[area.key];
      }
    }

    updateProgress();
  }

  function isAreaFilled(area){
    const v = state[area.key];
    if (!v) return false;
    if (area.sub && v === 'ok') {
      if (area.sub.type === 'multi') return (extra[area.key] || []).length > 0;
      if (area.sub.type === 'single') return extra[area.key] !== undefined;
    }
    return true;
  }

  function updateProgress(){
    const total = areas.length;
    const filled = areas.filter(isAreaFilled).length;
    meterCount.textContent = filled + '/' + total;
    meterFill.style.width = Math.round((filled/total)*100) + '%';
    const allFilled = filled === total;
    const cultoOk = culto.tipo && culto.opcao;
    generateBtn.disabled = !(allFilled && cultoOk);
    if (!cultoOk) {
      hintText.textContent = 'Selecione o culto e o horário/dia';
    } else if (!allFilled) {
      hintText.textContent = 'Preencha todas as áreas para gerar';
    } else {
      hintText.textContent = 'Tudo pronto — pode gerar o relatório';
    }
  }

  areas.forEach(buildRow);

  // Data e hora atuais como padrão
  const pad = n => String(n).padStart(2,'0');
  function setAgora(){
    const now = new Date();
    document.getElementById('dataInput').value = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
    document.getElementById('horaInput').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
  }
  setAgora();
  document.getElementById('nowBtn').addEventListener('click', setAgora);

  function formatDataBR(isoDate){
    if(!isoDate) return '';
    const [y,m,d] = isoDate.split('-');
    return d + '/' + m + '/' + y;
  }

  function buildReport(){
    const data = formatDataBR(document.getElementById('dataInput').value);
    const hora = document.getElementById('horaInput').value;
    let lines = [];
    lines.push('*Relatório Staff*');
    lines.push(nomeTipo[culto.tipo] + ' — ' + culto.opcao);
    lines.push('📅 ' + data + '  🕐 ' + hora);
    lines.push('');
    areas.forEach(area => {
      const v = state[area.key];
      let mark;
      if (v === 'ok') mark = '✅';
      else if (v === 'bad') mark = '❌';
      else mark = 'Sem base hoje';

      let extraTxt = '';
      if (area.sub && v === 'ok') {
        if (area.sub.type === 'multi') {
          const list = extra[area.key] || [];
          if (list.length) extraTxt = ' (' + list.join(', ') + ')';
        } else if (area.sub.type === 'single') {
          if (extra[area.key] !== undefined) {
            const val = extra[area.key];
            const display = area.sub.displayFn ? area.sub.displayFn(val) : val;
            extraTxt = ' (' + display + ')';
          }
        }
      }
      if (v === 'ok' && responsavel[area.key]) {
        extraTxt += ' — ' + (area.supPrefix ? 'Sup ' : '') + responsavel[area.key];
      }

      if (area.special && v === 'none') {
        lines.push(area.label + ': ' + mark);
      } else {
        lines.push(mark + ' ' + area.label + extraTxt);
      }
    });
    return lines.join('\n');
  }

  const resultBlock = document.getElementById('resultBlock');
  const reportText = document.getElementById('reportText');
  const copiedMsg = document.getElementById('copiedMsg');

  generateBtn.addEventListener('click', () => {
    reportText.value = buildReport();
    resultBlock.classList.add('show');
    resultBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(reportText.value);
    } catch (e) {
      reportText.select();
      document.execCommand('copy');
    }
    copiedMsg.classList.add('show');
    setTimeout(() => copiedMsg.classList.remove('show'), 1600);
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const text = reportText.value;
    if (navigator.share) {
      try {
        await navigator.share({ text: text });
      } catch (e) { /* usuário cancelou */ }
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  });
</script>
</body>
</html>
